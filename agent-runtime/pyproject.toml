[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postbridge-agent-runtime"
version = "0.1.0"
description = "Shared Postbridge OpenAI Agents SDK execution kernel"
requires-python = ">=3.11"
dependencies = ["openai-agents==0.24.0", "httpx2>=2.12.0,<3", "pydantic>=2.13.5"]

[tool.setuptools.packages.find]
where = ["src"]
