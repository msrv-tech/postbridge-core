[project]
name = "postbridge-core"
version = "0.1.2"
description = "Postbridge core sync engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.28.2",
  "aiohttp-socks>=0.11.0",
  "alembic>=1.18.4",
  "fastapi>=0.136.1",
  "python-multipart>=0.0.29",
  "uvicorn>=0.47.0",
  "celery>=5.6.3",
  "redis>=7.4.0",
  "sqlalchemy>=2.0.49",
  "psycopg2-binary>=2.9.12",
  "telethon>=1.43.2",
  "requests>=2.34.2",
  "httpx[socks]>=0.28.1",
  "langgraph>=1.2.0",
  "PySocks>=1.7.1",
  "feedparser>=6.0.12",
  "pydantic>=2.13.4",
  "cryptography>=48.0.0",
  "croniter>=6.2.2",
  "sentry-sdk[celery,fastapi]>=2.60.0",
  "boto3>=1.43.9",
  "pgvector>=0.4.2",
]

[project.scripts]
postbridge-telegram-bot = "postbridge.botkit.platforms.telegram.runtime:main"
postbridge-desktop-runtime = "postbridge.desktop_runtime:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"postbridge" = ["web/*.html"]
"postbridge.i18n" = ["locales/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/postbridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
