[project]
name = "postbridge-core"
version = "0.1.2"
description = "Postbridge core sync engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.30.0",
  "aiohttp-socks>=0.11.0",
  "alembic>=1.19.0",
  "fastapi>=0.141.1",
  "python-multipart>=0.0.32",
  "uvicorn>=0.52.1",
  "celery>=5.6.3",
  "redis>=8.1.0",
  "sqlalchemy>=2.0.51",
  "psycopg2-binary>=2.9.12",
  "telethon>=1.44.0",
  "requests>=2.34.2",
  "httpx[socks]>=0.28.1",
  "langgraph>=1.2.10",
  "PySocks>=1.7.1",
  "feedparser>=6.0.14",
  "pydantic>=2.13.4",
  "cryptography>=50.0.0",
  "croniter>=6.2.4",
  "sentry-sdk[celery,fastapi]>=2.66.1",
  "boto3>=1.43.66",
  "pgvector>=0.5.0",
]

[project.scripts]
postbridge-telegram-bot = "postbridge.botkit.platforms.telegram.runtime:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"postbridge" = ["web/*.html"]
"postbridge.i18n" = ["locales/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/postbridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
