# After changes in tests/ or src/: docker compose -f ci/docker-compose.yml build test
#   Or use run --build --rm test. The image copies code at build time and does not mount the repository.
# Stale test-run-* containers after Ctrl+C or a timeout:
#   docker rm -f $(docker ps -q --filter name=postbridge-core-ci-test-run)
# Stop the whole stack (postgres, redis): docker compose -f ci/docker-compose.yml down
name: postbridge-core-ci

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postbridge
      POSTGRES_PASSWORD: postbridge
      POSTGRES_DB: postbridge_test
    # Guard against stuck pytest runs: inactive open transactions do not hold locks forever.
    command: postgres -c idle_in_transaction_session_timeout=60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postbridge -d postbridge_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  test:
    build:
      context: ..
      dockerfile: ci/Dockerfile
    working_dir: /app
    volumes:
      - ./out:/out
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://postbridge:postbridge@postgres:5432/postbridge_test
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "pytest -q --cov=src/postbridge --cov-report=term-missing:skip-covered --cov-report=xml:/out/coverage-core.xml --cov-report=html:/out/htmlcov-core --cov-fail-under=80 && python scripts/export_openapi.py /out/openapi-core.json"
