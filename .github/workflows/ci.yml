name: ci

on:
  push:
    branches: ["main"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deployment-access:
    if: github.repository == 'msrv-tech/postbridge-core' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify access to the private RU workflow
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: python3 scripts/request_ru_deploy.py --check-access

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --no-git

  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create output dir
        run: mkdir -p ci/out

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Check frontend i18n boundaries
        run: npm --prefix web run check:i18n

      - name: Test analytics consent
        run: npm --prefix web run test:consent

      - name: Test workspace navigation
        run: npm --prefix web run test:workspace

      - name: Test general assistant proxy
        run: npm --prefix web run test:assistant-proxy

      - name: Install Playwright browser
        run: npm --prefix web exec playwright install --with-deps chromium

      - name: Run web smoke tests
        run: |
          npm --prefix web run build
          npm --prefix web run test:e2e
          npm --prefix web run test:e2e:saas

      - name: Build and run tests (Docker Compose)
        run: |
          docker compose --progress=plain -f ci/docker-compose.yml build
          docker compose -f ci/docker-compose.yml run --rm test

      - name: Enforce core line coverage >= 80%
        run: python scripts/check_line_coverage.py --coverage ci/out/coverage-core.xml --min 80 --label core

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openapi-core
          path: ci/out/openapi-core.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-core
          path: |
            ci/out/coverage-core.xml
            ci/out/htmlcov-core
          if-no-files-found: warn

  deployment-scope:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      io_changed: ${{ steps.scope.outputs.io_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python - <<'PYTHON'
          import os, subprocess
          from pathlib import PurePosixPath
          before = os.environ['BEFORE']
          changed = subprocess.check_output(['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']], text=True).splitlines()
          prefixes = ('src/', 'web/', 'alembic/')
          files = ['Dockerfile', 'pyproject.toml', 'scripts/deploy-prod.sh']
          deploy = any(path.startswith(prefixes) or path in files for path in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'io_changed={str(deploy).lower()}\n')
          PYTHON

  deploy-ru:
    needs: [secret-scan, test, deployment-access]
    if: github.repository == 'msrv-tech/postbridge-core' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Trigger RU release immediately and await deployment
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: python3 scripts/request_ru_deploy.py

  deploy-io:
    needs:
      - secret-scan
      - test
      - deployment-scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deployment-scope.outputs.io_changed == 'true'
    concurrency:
      group: postbridge-io-core-deploy
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - prod-io-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: postbridge-core
          fetch-depth: 0

      - name: Deploy postbridge-core IO
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          notify() {
            code=$?
            if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit "$code"; fi
            SHORT_SHA="$(printf '%s' "$SHA" | cut -c1-7)"
            RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"
            if [ "$code" -eq 0 ]; then
              DEPLOY_STATUS="success"
              TITLE="Postbridge Core IO deploy completed"
            else
              DEPLOY_STATUS="failure"
              TITLE="Postbridge Core IO deploy failed"
            fi
            MSG="$(printf '%s\nStatus: %s\nRepo: %s\nBranch: %s\nCommit: %s\nWorkflow: %s #%s.%s\nEvent: %s\nActor: %s\nRun: %s' \
              "$TITLE" "$DEPLOY_STATUS" "$REPOSITORY" "$BRANCH" "$SHORT_SHA" "$WORKFLOW" "$RUN_ID" "$RUN_ATTEMPT" "$EVENT_NAME" "$ACTOR" "$RUN_URL")"
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}" \
              -d "disable_web_page_preview=true" || true
            exit "$code"
          }
          trap notify EXIT

          sudo mkdir -p /opt
          sudo cp /opt/postbridge-core/.env /tmp/postbridge-core-env.bak 2>/dev/null || true
          sudo rsync -a --delete postbridge-core/ /opt/postbridge-core/
          sudo cp /tmp/postbridge-core-env.bak /opt/postbridge-core/.env 2>/dev/null || true
          sudo env \
            POSTBRIDGE_DEPLOY_COMPOSE_DIR=/opt/postbridge-saas/environments/production \
            POSTBRIDGE_DEPLOY_COMPOSE_FILE=docker-compose.yml \
            POSTBRIDGE_DEPLOY_ENV_FILE=/opt/postbridge-saas/environments/production/.env \
            POSTBRIDGE_DEPLOY_COMPOSE_PROJECT=postbridge_io \
            POSTBRIDGE_DEPLOY_SERIAL_BUILD=1 \
            POSTBRIDGE_BIND_POSTGRES=127.0.0.1:15432 \
            POSTBRIDGE_BIND_CORE_API=127.0.0.1:18000 \
            POSTBRIDGE_BIND_SAAS_API=127.0.0.1:18001 \
            POSTBRIDGE_BIND_PROMETHEUS=127.0.0.1:19090 \
            POSTBRIDGE_BIND_ALERTMANAGER=127.0.0.1:19093 \
            POSTBRIDGE_BIND_GRAFANA=127.0.0.1:13000 \
            flock /tmp/postbridge-io-deploy.lock bash /opt/postbridge-core/scripts/deploy-prod.sh
          wait_for_url() {
            url="$1"
            for attempt in $(seq 1 30); do
              if curl -fsS "$url"; then
                return 0
              fi
              if [ "$attempt" -eq 30 ]; then
                return 1
              fi
              sleep 2
            done
          }
          wait_for_url https://postbridge.io/health
          wait_for_url https://postbridge.io/api/app/runtime-config
