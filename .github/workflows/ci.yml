name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:latest@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --no-git

  test:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the production release dispatch contract
        run: python3 scripts/test_request_ru_deploy.py

      - name: Create output dir
        run: mkdir -p ci/out

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Check frontend i18n boundaries
        run: npm --prefix web run check:i18n

      - name: Test analytics consent
        run: npm --prefix web run test:consent

      - name: Test workspace navigation
        run: npm --prefix web run test:workspace

      - name: Test connector navigation and access policy
        run: npm --prefix web run test:connectors

      - name: Test general assistant proxy
        run: npm --prefix web run test:assistant-proxy

      - name: Install Playwright browser
        run: npm --prefix web exec playwright install --with-deps chromium

      - name: Run web smoke tests
        run: |
          npm --prefix web run build
          npm --prefix web run test:e2e
          npm --prefix web run test:e2e:saas

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Cache the canonical CI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ci/Dockerfile
          load: true
          tags: postbridge-core-ci-test:latest
          cache-from: type=gha,scope=core-ci
          cache-to: type=gha,mode=max,scope=core-ci
      - name: Run canonical tests
        run: docker compose -f ci/docker-compose.yml run --rm test
      - name: Record reusable CI evidence
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('ci/out/proof.json').write_text(json.dumps({'sha': os.environ['GITHUB_SHA'], 'python': '3.14', 'node': '26'}))
          PYTHON

      - name: Enforce core line coverage >= 80%
        run: python scripts/check_line_coverage.py --coverage ci/out/coverage-core.xml --min 80 --label core

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          overwrite: true
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          overwrite: true
          name: openapi-core
          path: ci/out/openapi-core.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          overwrite: true
          name: coverage-core
          path: |
            ci/out/proof.json
            ci/out/coverage-core.xml
            ci/out/htmlcov-core
          if-no-files-found: warn
