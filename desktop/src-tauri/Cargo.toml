[package]
name = "postbridge-desktop"
version = "0.1.0"
description = "Postbridge Desktop self-host runtime supervisor"
authors = ["Postbridge"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-shell = "2.3.2"
