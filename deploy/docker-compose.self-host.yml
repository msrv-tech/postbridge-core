# Self-host: Core API + Postgres + Redis + Celery (worker + beat).
# Repository layout: the deploy directory is relative to the postbridge-core root.
#
# Prepare: copy ../.env.example to ../.env and set at least
#   POSTGRES_PASSWORD, DATABASE_URL, CREDENTIALS_ENCRYPTION_KEY,
#   CORE_SERVICE_TOKEN, and any external API credentials you need.
#
# Start: docker compose -f deploy/docker-compose.self-host.yml --env-file ../.env up -d --build
# Migrations: core-migrate runs alembic upgrade head when the stack starts.

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: postbridge
    volumes:
      - pb_core_selfhost_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postbridge -d postbridge"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  core-migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      APP_ENV: ${APP_ENV:-dev}
      POSTBRIDGE_APP_MODE: ${POSTBRIDGE_APP_MODE:-selfhost}
      POSTBRIDGE_SELFHOST_TENANT_ID: ${POSTBRIDGE_SELFHOST_TENANT_ID:-00000000-0000-4000-8000-000000000001}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  core-api:
    build:
      context: ..
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-dev}
      POSTBRIDGE_APP_MODE: ${POSTBRIDGE_APP_MODE:-selfhost}
      POSTBRIDGE_SELFHOST_TENANT_ID: ${POSTBRIDGE_SELFHOST_TENANT_ID:-00000000-0000-4000-8000-000000000001}
      CELERY_TASK_ALWAYS_EAGER: "0"
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?set in .env}
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-}
      STATUS_EVENT_WEBHOOK_URL: ${STATUS_EVENT_WEBHOOK_URL:-}
      STATUS_EVENT_WEBHOOK_TOKEN: ${STATUS_EVENT_WEBHOOK_TOKEN:-}
    command: uvicorn postbridge.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  core-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-dev}
      POSTBRIDGE_APP_MODE: ${POSTBRIDGE_APP_MODE:-selfhost}
      POSTBRIDGE_SELFHOST_TENANT_ID: ${POSTBRIDGE_SELFHOST_TENANT_ID:-00000000-0000-4000-8000-000000000001}
      CELERY_TASK_ALWAYS_EAGER: "0"
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?set in .env}
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-}
      STATUS_EVENT_WEBHOOK_URL: ${STATUS_EVENT_WEBHOOK_URL:-}
      STATUS_EVENT_WEBHOOK_TOKEN: ${STATUS_EVENT_WEBHOOK_TOKEN:-}
    command: celery -A postbridge.workers.celery_app:celery_app worker -l info -B
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pb_core_selfhost_pg:
