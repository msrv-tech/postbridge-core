[alembic]
script_location = alembic
prepend_sys_path = .
# Переопределяется в alembic/env.py из DATABASE_URL (PostgreSQL).
sqlalchemy.url = postgresql+psycopg2://postbridge:postbridge@localhost:5432/postbridge

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
